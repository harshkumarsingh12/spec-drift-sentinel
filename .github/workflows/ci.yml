name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Runs with no API key configured — proves the deterministic layer
      # stands alone (AC-3, AC-6).
      - name: Architecture rules
        run: npm run sentinel -- arch

      - name: Traceability matrix
        run: npm run sentinel -- trace
