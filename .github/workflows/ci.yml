name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+: node --test needs glob support for the test pattern
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Runs with no API key configured — proves the deterministic layer
      # stands alone (AC-3, AC-6).
      - name: Architecture rules
        run: npm run sentinel -- arch

      - name: Traceability matrix
        run: npm run sentinel -- trace

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Chromium only — cross-browser coverage is not what this project
      # demonstrates, and a fast pipeline matters more here.
      - name: Install Chromium
        working-directory: web
        run: npx playwright install chromium --with-deps

      # playwright.config.ts builds and starts the app itself.
      - name: Run Playwright tests
        working-directory: web
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Render
    needs: [verify, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # render.yaml defines the service; this triggers a rebuild+redeploy of
      # the service already provisioned from it. One-time setup on render.com
      # ("New" -> "Blueprint", connect this repo) and the RENDER_DEPLOY_HOOK_URL
      # secret are required — see README's Deployment section.
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set — skipping deploy."
            echo "See README.md's Deployment section to configure it."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"

  release:
    name: Create GitHub release
    needs: [verify, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            **🔗 Live dashboard: https://spec-drift-sentinel.onrender.com/**

            Click through Inbox → a diff-viewer verdict → Matrix → Timeline. It reads real,
            live-generated data — not a static screenshot.

            Local setup: see README.md and CONTRIBUTING.md.
