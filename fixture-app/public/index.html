<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture Cart</title>
    <style>
      /* Deliberately minimal. This is a demo prop, not a product. */
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --ok: #3fb950;
      }
      body {
        margin: 0;
        padding: 48px 24px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 420px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p.sub {
        color: var(--muted);
        margin: 0 0 24px;
        font-size: 14px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 20px;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input,
      button {
        font: inherit;
        border-radius: 6px;
        border: 1px solid var(--border);
        padding: 10px 12px;
      }
      input {
        width: 100%;
        background: var(--bg);
        color: var(--text);
      }
      button {
        width: 100%;
        margin-top: 12px;
        background: #1c2128;
        color: var(--text);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--muted);
      }
      dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 16px;
        margin: 24px 0 0;
        font-variant-numeric: tabular-nums;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        text-align: right;
      }
      dd.total {
        font-weight: 600;
        border-top: 1px solid var(--border);
        padding-top: 8px;
      }
      dt.total {
        border-top: 1px solid var(--border);
        padding-top: 8px;
      }
      .free {
        color: var(--ok);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fixture Cart</h1>
      <p class="sub">Demo fixture for Spec Drift Sentinel. Shipping rules live in spec/PRD.md.</p>

      <div class="panel">
        <label for="subtotal">Subtotal</label>
        <input id="subtotal" data-testid="subtotal-input" type="number" min="0" step="1" value="400" />
        <button id="quote" data-testid="quote-button" type="button">Calculate</button>

        <dl>
          <dt>Subtotal</dt>
          <dd data-testid="subtotal">—</dd>
          <dt>Shipping</dt>
          <dd data-testid="shipping-fee">—</dd>
          <dt class="total">Total</dt>
          <dd class="total" data-testid="total">—</dd>
        </dl>
      </div>
    </main>

    <script>
      // AC-9: every monetary value renders to exactly two decimal places.
      const money = (n) => Number(n).toFixed(2);

      const el = (id) => document.querySelector(`[data-testid="${id}"]`);

      async function refresh() {
        const subtotal = el('subtotal-input').value;
        const res = await fetch(`/api/cart?subtotal=${encodeURIComponent(subtotal)}`);
        if (!res.ok) return;

        const quote = await res.json();
        el('subtotal').textContent = money(quote.subtotal);
        el('shipping-fee').textContent = money(quote.shippingFee);
        el('total').textContent = money(quote.total);
        el('shipping-fee').classList.toggle('free', quote.shippingFee === 0);
      }

      el('quote-button').addEventListener('click', refresh);
      refresh();
    </script>
  </body>
</html>
